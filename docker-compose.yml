services:
  db:
    image: mysql:8.0
    container_name: ntnu-kpro-ai-assistant-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # No fallback!
      MYSQL_DATABASE: ntnu-kpro-ai-assistant
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: ntnu-kpro-webapp
    restart: always
    environment:
      - DATABASE_URL=mysql://${DB_USER:-root}:${DB_PASSWORD}@db:3306/ntnu-kpro-ai-assistant
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ntnu-kpro-backend
    restart: always
    environment:
      - CHROMA_PATH=/backend/src/chroma
    ports:
      - '8000:8000'
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/src/data:/app/src/data
    depends_on:
      - db

volumes:
  mysql_data:
