name: CD
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
jobs:
  build:
    runs-on: ubuntu-latest
    # Only runs if CI was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: git_sha
        run: echo "GIT_SHA=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV

      - name: Build and Push Docker Backend Image
        run: |
          docker build -t ghcr.io/Nicoletapa/kartai-utstillingsvindu-api:${{ env.GIT_SHA }} ./backend
          docker push ghcr.io/Nicoletapa/kartai-utstillingsvindu-api:${{ env.GIT_SHA }}

      - name: Build and Push Docker Webapp Image
        run: |
          docker build -t ghcr.io/Nicoletapa/kartai-utstillingsvindu-webapp:${{ env.GIT_SHA }} ./webapp
          docker push ghcr.io/Nicoletapa/kartai-utstillingsvindu-webapp:${{ env.GIT_SHA }}
